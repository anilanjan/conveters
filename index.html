<!DOCTYPE html>
<html>
<head>
  <title>Image Format Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background-color: #f9f9f9;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      color: #333;
    }

    label, select, input, button {
      display: block;
      width: 100%;
      margin: 10px 0;
      font-size: 16px;
    }

    input[type="file"] {
      padding: 5px;
    }

    button {
      padding: 10px;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    a#downloadLink {
      display: block;
      margin-top: 15px;
      text-align: center;
      background-color: #28a745;
      color: white;
      padding: 10px;
      text-decoration: none;
      border-radius: 4px;
    }

    a#downloadLink:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <h2>Image Format Converter</h2>
  <input type="file" id="imageInput" accept="image/*">
  
  <label for="format">Convert to:</label>
  <select id="format">
    <option value="image/jpeg">JPG</option>
    <option value="image/png">PNG</option>
    <option value="image/webp">WEBP</option>
    <option value="image/bmp">BMP</option>
    <option value="image/gif">GIF</option>
  </select>
  
  <button onclick="convertImage()">Convert</button>
  
  <a id="downloadLink" style="display:none" download="converted-image">Download Converted Image</a>
  
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    function convertImage() {
      const fileInput = document.getElementById('imageInput');
      const format = document.getElementById('format').value;
      const canvas = document.getElementById('canvas');
      const downloadLink = document.getElementById('downloadLink');

      if (!fileInput.files.length) {
        alert('Please select an image file.');
        return;
      }

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function(event) {
        const img = new Image();
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);

          let dataURL = canvas.toDataURL(format);
          downloadLink.href = dataURL;

          const extension = format.split('/')[1];
          downloadLink.download = `converted-image.${extension}`;
          downloadLink.textContent = `Download as ${extension.toUpperCase()}`;
          downloadLink.style.display = 'block';
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
